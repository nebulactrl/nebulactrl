name: Feature request
description: Something NebulaCtrl should do that it does not do today.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today. Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work, in the dashboard, the CLI, the API or `nebula.toml`.
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: What you do instead today, if anything.
