# OpenSSF Scorecard: grades the repository's supply-chain practices and publishes the
# result for the badge in the README (https://scorecard.dev/viewer/?uri=github.com/nebulactrl/nebulactrl).
# Publishing restricts what this workflow may contain: only the default branch, no top-level
# env or defaults, no run steps, no other job with id-token: write and only a few actions.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "29 5 * * 6" # Saturdays, 05:29 UTC, on the default branch
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload the SARIF report to code scanning
      id-token: write # publish the result (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
          category: scorecard
