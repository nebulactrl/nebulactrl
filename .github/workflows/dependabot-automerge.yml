# Turns on auto-merge for a Dependabot pull request that only carries patch updates
# from the groups in AUTOMERGE_GROUPS (.github/dependabot.yml): GitHub Actions, Docker
# and Compose images and Bun development dependencies, each released at least 7 days
# ago (the cooldown). GitHub squash-merges it once the required checks of the main
# ruleset pass. An ungrouped patch update counts too when the pull request's ecosystem
# and directory have their *-patch group in AUTOMERGE_GROUPS: Dependabot leaves an
# update out of the group when the group's update-types do not match, as for a
# digest-only bump of a pinned image. Everything else stays for a human: Go modules,
# Bun runtime dependencies, minor and major updates, and security updates (they skip
# the cooldown and carry no group; the pull request body says which they are).
# The rule lives in scripts/ci/dependabot-automerge-check.sh, tested by
# scripts/ci/test-dependabot-automerge.sh.
#
# The pull request must be opened by Dependabot and hold exactly one commit, by
# Dependabot and verified, so a push by anyone else to the branch stops it.
#
# Auto-merge is enabled with a token of the repository's auto-merge GitHub App, not
# with the GITHUB_TOKEN: a merge by the GITHUB_TOKEN starts no workflow, so ci and
# security would not run on main. A run that Dependabot starts only gets Dependabot
# secrets, so the App's credentials are Dependabot secrets (CONTRIBUTING.md, "Owner
# actions").
name: dependabot-automerge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: dependabot auto-merge
    # The author of the pull request, not github.actor (whoever triggered this run).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the commits of the pull request
    steps:
      # The base commit, not the pull request: the rule that judges the pull request
      # must not be changeable by it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Check the updates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
          AUTOMERGE_GROUPS: github-actions-patch docker-image-patch docker-dev-patch compose-install-patch compose-dev-patch bun-dev-patch
        run: scripts/ci/dependabot-automerge-check.sh

      - name: Create a token of the auto-merge App
        id: app-token
        if: steps.check.outputs.eligible == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        if: steps.check.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
