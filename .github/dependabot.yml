version: 2

# Monthly and grouped, so updates arrive as at most one pull request per ecosystem.
# The workflows pin actions to commit SHAs; dependabot rewrites the SHA and the
# trailing version comment together.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      bun-workspace:
        patterns:
          - "*"
