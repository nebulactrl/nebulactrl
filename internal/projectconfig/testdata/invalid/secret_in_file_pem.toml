# expect: secret_in_file
# Files are stored as plain text in the service config: a private key must
# never be written into one.
schema = 1
server = "fra-1"

[services.web]
image = "nginx:1.27"
port = 80

[services.web.files."/etc/ssl/private/site.key"]
mode = "0600"
content = """
-----BEGIN RSA PRIVATE KEY-----
ZmFrZS1rZXktbWF0ZXJpYWwtZm9yLXRlc3Rz
-----END RSA PRIVATE KEY-----
"""
