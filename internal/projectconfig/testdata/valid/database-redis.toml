#:schema https://nebula.example.com/schema/nebula.toml.json
schema  = 1
project = "data"
server  = "fra-1"

# A managed Valkey with variables, a memory limit and an hourly backup.
[services.cache]
name               = "Cache"
memory_mb          = 256
cpus               = 0.5
stop_grace_seconds = 60

[services.cache.database]
engine  = "valkey"
version = "8"

[services.cache.variables]
MAXMEMORY_POLICY = "allkeys-lru"
CACHE_REGION     = "eu"

[services.cache.secrets]
keys = ["EXTRA_AUTH_TOKEN"]

[services.cache.backups.hourly]
destination     = "offsite-s3"
cron            = "0 * * * *"
timezone        = "UTC"
enabled         = true
retention_count = 24
retention_days  = 7

[services.cache.uptime]
failure_threshold = 3
reminder_minutes  = 30

# MongoDB is source-available software: the licence has to be accepted.
[services.docs]
name         = "Documents"
memory_mb    = 1024
cpus         = 1
depends_on   = ["cache"]
block_egress = true

[services.docs.database]
engine         = "mongodb"
version        = "8.0"
name           = "catalog"
username       = "catalog_rw"
accept_license = true

[services.docs.variables]
COLLECTION_PREFIX = "cat_"

[services.docs.backups.nightly]
destination     = "offsite-s3"
cron            = "30 2 * * *"
retention_count = 14
