name: MAZANOKE
summary: Image optimizer that compresses, resizes and converts images entirely in the browser; no uploads to the server.
description: MAZANOKE is a small static web app for optimising images locally in the browser and removing EXIF data. This template serves the project's own image and keeps no data.
category: media
