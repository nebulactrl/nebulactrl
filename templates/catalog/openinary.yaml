schema: 1
id: openinary
revision: 1
name: Openinary
summary: Self-hosted media delivery API with on-the-fly image and video transformations, an alternative to Cloudinary.
description: Runs the Openinary full image (API, dashboard and nginx in one container) with its SQLite auth database, transformation cache and uploaded files on persistent volumes. The first admin account is created from the install form.
category: media
tags: [images, video, transformations, cdn, cloudinary-alternative]
links:
  website: https://openinary.dev
  docs: https://docs.openinary.dev
  source: https://github.com/openinary/openinary
upstream:
  license: AGPL-3.0
  licenseUrl: https://github.com/openinary/openinary/blob/main/LICENSE
  class: copyleft
origin:
  type: dokploy
  path: blueprints/openinary
  commit: e44418a
  license: MIT
requires:
  memoryMb: 1536
  diskGb: 10
inputs:
  - {key: ADMIN_NAME, label: Admin display name, default: Admin}
  - {key: ADMIN_EMAIL, format: email, label: Admin e-mail, required: true}
  - key: ADMIN_PASSWORD
    label: Admin password
    secret: true
    default: "${{secret(20)}}"
services:
  - key: openinary
    name: Openinary
    kind: app
    image: openinary/openinary:v0.5.0
    digest: sha256:4965e429ce5ce12ef014826940aa7d83623bf266ad401fe6dd5b8371cbd5c42a
    port: 3000
    healthcheck:
      type: http
      path: /health
      startPeriodSeconds: 30
      deadlineSeconds: 300
    domains:
      - generate: true
    env:
      NODE_ENV: production
      MODE: fullstack
      NEXT_PUBLIC_API_BASE_URL: /api
      BETTER_AUTH_SECRET: ${{secret(48)}}
      BETTER_AUTH_URL: ${{NEBULA_PUBLIC_URL}}
      API_SECRET: ${{secret(48)}}
      DB_PATH: /app/data/auth.db
      DOCKER_CONTAINER: "true"
      OPENINARY_ADMIN_NAME: ${input:ADMIN_NAME}
      OPENINARY_ADMIN_EMAIL: ${input:ADMIN_EMAIL}
      OPENINARY_ADMIN_PASSWORD: ${input:ADMIN_PASSWORD}
    volumes:
      - name: data
        path: /app/data
      - name: cache
        path: /app/apps/api/cache
      - name: public
        path: /app/apps/api/public
    resources:
      memoryMb: 1536
group: Openinary
notes:
  - "Sign in to the dashboard with the admin e-mail and password from the install form. The account is only created on the very first start; later changes to these variables do not reset it."
  - "Create an API key in the dashboard to upload and transform media; transformed files are served from /t/..."
