schema: 1
id: flagsmith
revision: 1
name: Flagsmith
summary: Feature flag and remote configuration service with a dashboard, segments and an API.
description: Runs the official Flagsmith image (API and dashboard in one container, background tasks in a thread) with a managed Postgres database that also stores flag analytics.
category: devtools
tags: [feature-flags, remote-config, ab-testing, api]
links:
  website: https://www.flagsmith.com
  docs: https://docs.flagsmith.com
  source: https://github.com/Flagsmith/flagsmith
upstream:
  license: BSD-3-Clause
  licenseUrl: https://github.com/Flagsmith/flagsmith/blob/main/LICENSE.md
  class: permissive
origin:
  type: dokploy
  path: blueprints/flagsmith
  commit: e44418a
  license: MIT
requires:
  memoryMb: 1024
  diskGb: 5
services:
  - key: flagsmith
    name: Flagsmith
    kind: app
    image: flagsmith/flagsmith:2.287.0
    digest: sha256:ecd69b757e2694ce0ea9974af91661f51a2fd1834eda9480883d2f90981ed110
    port: 8000
    healthcheck:
      type: http
      path: /health/liveness/
      startPeriodSeconds: 60
      deadlineSeconds: 600
    dependsOn: [db]
    domains:
      - generate: true
    env:
      DATABASE_URL: ${{db.DATABASE_URL}}
      DJANGO_SECRET_KEY: ${{secret(50)}}
      DJANGO_ALLOWED_HOSTS: "*"
      ENVIRONMENT: production
      FLAGSMITH_DOMAIN: ${{NEBULA_PUBLIC_DOMAIN}}
      USE_POSTGRES_FOR_ANALYTICS: "true"
    resources:
      memoryMb: 1024
  - key: db
    name: Flagsmith DB
    kind: database
    database:
      engine: postgres
      version: "16"
      databaseName: flagsmith
group: Flagsmith
notes:
  - "Open the site and use Sign up to create the first account and organisation; there is no default login."
  - "Anyone who can reach the site can sign up. After creating your admin, set PREVENT_SIGNUP=true on the service and redeploy (invite further users from the dashboard)."
  - "Password-reset and invitation emails need SMTP settings (EMAIL_BACKEND, EMAIL_HOST, SENDER_EMAIL, ...) as described in the Flagsmith docs."
