    resources:
      memoryMb: 512
  - key: bridge
    name: ChirpStack Gateway Bridge
    kind: app
    image: chirpstack/chirpstack-gateway-bridge:4.1.2
    digest: sha256:cc820a195e739fa653c6d7fd403abe73b9b0c79b5dd4ab0f4bf9c6443470121b
    port: 0
    healthcheck:
      type: http
      path: /metrics
      port: 9100
      startPeriodSeconds: 10
      deadlineSeconds: 120
    dependsOn: [mosquitto]
    ports:
      - {name: semtech-udp, port: 1700, protocol: udp, publish: true}
    env:
      INTEGRATION__MQTT__AUTH__GENERIC__SERVERS: tcp://${{mosquitto.NEBULA_PRIVATE_HOST}}:1883
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: ${input:REGION}/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: ${input:REGION}/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: ${input:REGION}/gateway/{{ .GatewayID }}/command/#
      METRICS__PROMETHEUS__ENDPOINT_ENABLED: "true"
      METRICS__PROMETHEUS__BIND: 0.0.0.0:9100
    resources:
      memoryMb: 128
  - key: mosquitto
    name: ChirpStack MQTT
    kind: app
    image: eclipse-mosquitto:2.0.22
    digest: sha256:09b62ff32c2e7b64d4b431b9a89236073289b68db273de2b089edeb9b0d92b5c
    port: 0
    healthcheck:
      type: tcp
      port: 1883
      startPeriodSeconds: 5
      deadlineSeconds: 60
    files:
      - path: /mosquitto/config/mosquitto.conf
        mode: "0444"
        content: |
          listener 1883
          allow_anonymous true
    resources:
      memoryMb: 128
  - key: postgres
    name: ChirpStack DB
    kind: database
    database:
      engine: postgres
      version: "16"
      databaseName: chirpstack
  - key: redis
    name: ChirpStack Redis
    kind: database
    database:
      engine: redis
      version: "8"
group: ChirpStack
notes:
  - "Sign in to ChirpStack with admin / admin and change the password right away."
  - "Point your gateways' Semtech UDP packet forwarder at this server on UDP port 1700; the MQTT broker stays internal."
  - "Only the region chosen at install is enabled. To use another region later, change enabled_regions in chirpstack.toml and the topic templates of the Gateway Bridge."
