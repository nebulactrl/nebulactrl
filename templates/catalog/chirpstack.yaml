schema: 1
id: chirpstack
revision: 1
name: ChirpStack
summary: Open-source LoRaWAN network server for managing IoT devices, gateways and applications.
description: ChirpStack is a LoRaWAN network server with a web UI. This template runs ChirpStack with a managed Postgres and Redis, an MQTT broker and the ChirpStack Gateway Bridge, which receives the Semtech UDP packets of your gateways on port 1700.
category: homelab
tags: [lorawan, iot, mqtt, gateway, network-server]
links:
  website: https://www.chirpstack.io
  docs: https://www.chirpstack.io/docs/
  source: https://github.com/chirpstack/chirpstack
upstream:
  license: MIT
  licenseUrl: https://github.com/chirpstack/chirpstack/blob/master/LICENSE
  class: permissive
origin:
  type: dokploy
  path: blueprints/chirpstack
  commit: e44418a
  license: MIT
requires:
  memoryMb: 1024
  diskGb: 2
inputs:
  - {key: REGION, label: "LoRaWAN region (must match your gateways and devices)", default: eu868, options: ["eu868", "us915_0", "us915_1", "as923", "as923_2", "au915_0", "in865", "kr920", "ru864", "eu433", "cn470_10", "as923_3"]}
services:
  - key: chirpstack
    name: ChirpStack
    kind: app
    image: chirpstack/chirpstack:4.20.0
    digest: sha256:6ef779ce1dfbef273a1c99649672170c791441b42832c8245b01110eab3a369a
    port: 8080
    command: [-c, /etc/chirpstack]
    healthcheck:
      type: http
      path: /
      startPeriodSeconds: 20
      deadlineSeconds: 240
    dependsOn: [postgres, redis, mosquitto]
    domains:
      - generate: true
    env:
      DATABASE_URL: ${{postgres.DATABASE_URL}}
      REDIS_URL: ${{redis.REDIS_URL}}
      MQTT_BROKER_HOST: ${{mosquitto.NEBULA_PRIVATE_HOST}}
      API_SECRET: ${{secret(44)}}
    files:
      - path: /etc/chirpstack/chirpstack.toml
        mode: "0444"
        content: |
          [logging]
            level="info"
          
          [postgresql]
            dsn="$DATABASE_URL?sslmode=disable"
            max_open_connections=10
            min_idle_connections=0
          
          [redis]
            servers=[
              "$REDIS_URL",
            ]
            tls_enabled=false
            cluster=false
          
          [network]
            net_id="000000"
            enabled_regions=[
              "${input:REGION}",
            ]
          
          [api]
            bind="0.0.0.0:8080"
            secret="$API_SECRET"
          
          [integration]
            enabled=["mqtt"]
          
            [integration.mqtt]
              server="tcp://$MQTT_BROKER_HOST:1883/"
              json=true
      - path: /etc/chirpstack/region_eu868.toml
        mode: "0444"
