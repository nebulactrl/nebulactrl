schema: 1
id: gitea
revision: 1
name: Gitea
summary: Lightweight self-hosted Git service with issues, pull requests, packages and CI.
description: Gitea is a painless, self-hosted Git forge. This template runs the official image with a managed Postgres database and a persistent /data volume. The installer is skipped (INSTALL_LOCK), so the first account you register becomes the administrator.
category: devtools
tags: [git, forge, code-hosting, ci]
icon: gitea
links:
  website: https://about.gitea.com
  docs: https://docs.gitea.com
  source: https://github.com/go-gitea/gitea
upstream:
  license: MIT
  licenseUrl: https://github.com/go-gitea/gitea/blob/main/LICENSE
  class: permissive
origin:
  type: original
requires:
  memoryMb: 512
  diskGb: 5
services:
  - key: app
    name: Gitea
    kind: app
    image: gitea/gitea:28.2.0
    digest: sha256:30777c91280d973fa02be48b1ade735bd6859e8f6f7af3b4444d519437852504
    port: 3000
    healthcheck:
      type: http
      path: /api/healthz
      startPeriodSeconds: 20
      deadlineSeconds: 240
    dependsOn: [db]
    domains:
      - generate: true
    env:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: ${{db.DATABASE_HOST}}:${{db.DATABASE_PORT}}
      GITEA__database__NAME: ${{db.DATABASE_NAME}}
      GITEA__database__USER: ${{db.DATABASE_USER}}
      GITEA__database__PASSWD: ${{db.DATABASE_PASSWORD}}
      GITEA__server__DOMAIN: ${{NEBULA_PUBLIC_DOMAIN}}
      GITEA__server__ROOT_URL: ${{NEBULA_PUBLIC_URL}}/
      GITEA__security__INSTALL_LOCK: "true"
    volumes:
      - name: data
        path: /data
    ports:
      - name: ssh
        port: 22
        protocol: tcp
        publish: false
    resources:
      memoryMb: 512
  - key: db
    name: Gitea DB
    kind: database
    database:
      engine: postgres
      version: "17"
      databaseName: gitea
group: Gitea
notes:
  - "The web installer is disabled: open the generated domain and register the first account; it becomes the site administrator. Then consider turning off open registration under Site Administration or via GITEA__service__DISABLE_REGISTRATION=true."
  - "Git over HTTPS works out of the box. The built-in SSH server listens on container port 22, which is declared but not published (ports below 1024 cannot be published and the host's own sshd would clash); it is reachable from other services on the private network only."
