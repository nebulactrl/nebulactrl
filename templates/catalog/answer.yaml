schema: 1
id: answer
revision: 1
name: Apache Answer
summary: Q&A platform for building a community question-and-answer site or knowledge base.
description: Apache Answer is a self-hosted Q&A and community forum platform. This template runs the official image against a managed Postgres database and completes the installer automatically from the inputs below.
category: web
tags: [q-and-a, forum, community, knowledge-base]
links:
  website: https://answer.apache.org
  docs: https://answer.apache.org/docs
  source: https://github.com/apache/answer
upstream:
  license: Apache-2.0
  licenseUrl: https://github.com/apache/answer/blob/main/LICENSE
  class: permissive
origin:
  type: dokploy
  path: blueprints/answer
  commit: e44418a
  license: MIT
requires:
  memoryMb: 512
  diskGb: 2
inputs:
  - {key: SITE_NAME, label: Site name, default: Answer}
  - {key: CONTACT_EMAIL, format: email, label: Contact email, required: true}
  - {key: ADMIN_NAME, label: Admin username, default: admin}
  - {key: ADMIN_EMAIL, format: email, label: Admin email (used to sign in), required: true}
  - {key: ADMIN_PASSWORD, label: Admin password (8-32 characters), secret: true, default: "${{secret(20)}}"}
services:
  - key: answer
    name: Answer
    kind: app
    image: apache/answer:2.0.3
    digest: sha256:0863470d8293294b899f8b39a373df6d6250c3f3e412ea0e483924b41e23428f
    port: 80
    healthcheck:
      type: http
      path: /healthz
      startPeriodSeconds: 20
      deadlineSeconds: 240
    dependsOn: [db]
    domains:
      - generate: true
    env:
      AUTO_INSTALL: "true"
      DB_TYPE: postgres
      DB_HOST: ${{db.DATABASE_HOST}}:${{db.DATABASE_PORT}}
      DB_NAME: ${{db.DATABASE_NAME}}
      DB_USERNAME: ${{db.DATABASE_USER}}
      DB_PASSWORD: ${{db.DATABASE_PASSWORD}}
      LANGUAGE: en_US
      SITE_NAME: ${input:SITE_NAME}
      SITE_URL: ${{NEBULA_PUBLIC_URL}}
      CONTACT_EMAIL: ${input:CONTACT_EMAIL}
      ADMIN_NAME: ${input:ADMIN_NAME}
      ADMIN_EMAIL: ${input:ADMIN_EMAIL}
      ADMIN_PASSWORD: ${input:ADMIN_PASSWORD}
      EXTERNAL_CONTENT_DISPLAY: ask_before_display
    volumes:
      - name: data
        path: /data
    resources:
      memoryMb: 512
  - key: db
    name: Answer DB
    kind: database
    database:
      engine: postgres
      version: "17"
      databaseName: answer
group: Answer
notes:
  - "The installer runs on first start: sign in with the admin email and password from the install form."
  - "The site URL is set from the generated domain; if you attach a custom domain, change it under Admin > General."
