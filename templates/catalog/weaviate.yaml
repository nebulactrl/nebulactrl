schema: 1
id: weaviate
revision: 1
name: Weaviate
summary: Open-source vector database for semantic and hybrid search over objects and embeddings, with REST, GraphQL and gRPC APIs.
description: Weaviate stores objects together with their vectors and combines vector search with keyword search and filters. This template runs a single node with API-key authentication, RBAC for the admin user and a persistent data volume.
category: ai
tags: [vector-database, embeddings, semantic-search, rag, ai]
icon: weaviate
links:
  website: https://weaviate.io
  docs: https://docs.weaviate.io
  source: https://github.com/weaviate/weaviate
upstream:
  license: BSD-3-Clause (enterprise features in the wl directory are under a separate licence)
  licenseUrl: https://github.com/weaviate/weaviate/blob/main/LICENSE
  class: source-available
origin:
  type: coolify
  path: templates/compose/weaviate.yaml
  commit: 1d28642
  license: Apache-2.0
requires:
  memoryMb: 2048
  diskGb: 5
services:
  - key: weaviate
    name: Weaviate
    kind: app
    image: semitechnologies/weaviate:1.40.2
    digest: sha256:0083587dc01f33112e5406ce9b471df1abea480c71a0407af903929a389ae08a
    port: 8080
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    healthcheck:
      type: http
      path: /v1/.well-known/ready
      startPeriodSeconds: 20
      deadlineSeconds: 240
    domains:
      - generate: true
    env:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
      QUERY_DEFAULTS_LIMIT: "25"
      DISABLE_TELEMETRY: "true"
      GOMEMLIMIT: 1536MiB
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${{secret(40)}}
      AUTHENTICATION_APIKEY_USERS: admin
      AUTHORIZATION_ENABLE_RBAC: "true"
      AUTHORIZATION_RBAC_ROOT_USERS: admin
    ports:
      - {name: grpc, port: 50051, protocol: tcp, publish: true}
    volumes:
      - name: data
        path: /var/lib/weaviate
    resources:
      memoryMb: 2048
group: Weaviate
notes:
  - "Anonymous access is off. Connect with the API key in the AUTHENTICATION_APIKEY_ALLOWED_KEYS variable as a Bearer token; it belongs to the root user admin."
  - "REST and GraphQL are served on the generated domain. The v4 client libraries also need gRPC, published as plain TCP on port 50051 of the server: connect them with the generated host name, gRPC port 50051 and no TLS on that port."
  - "Embedding and generative modules for hosted providers (OpenAI, Cohere and others) need their provider API keys passed per request; modules that run local models are not part of this template."
