name: Drawnix
summary: Open-source whiteboard for mind maps, flowcharts and freehand drawing, served as a static web app.
description: Drawnix is a browser-based whiteboard with mind maps, flowcharts and free drawing. This template runs the static web build published by the project; boards are stored in the browser, so there is no server-side data.
