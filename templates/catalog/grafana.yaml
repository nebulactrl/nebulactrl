schema: 1
id: grafana
revision: 1
name: Grafana
summary: Open-source dashboards and visualisation for metrics, logs and traces from many data sources.
description: Grafana OSS lets you query, visualise and alert on data from Prometheus, Loki, SQL databases and many other sources. This template runs the official image with its embedded SQLite database on a persistent volume.
category: analytics
tags: [dashboards, observability, metrics, monitoring]
icon: grafana
links:
  website: https://grafana.com/oss/grafana/
  docs: https://grafana.com/docs/grafana/latest/
  source: https://github.com/grafana/grafana
upstream:
  license: AGPL-3.0-only
  licenseUrl: https://github.com/grafana/grafana/blob/main/LICENSE
  class: copyleft
origin:
  type: original
requires:
  memoryMb: 512
  diskGb: 2
services:
  - key: app
    name: Grafana
    kind: app
    image: grafana/grafana:13.2.4
    digest: sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    port: 3000
    healthcheck:
      type: http
      path: /api/health
      startPeriodSeconds: 20
      deadlineSeconds: 240
    domains:
      - generate: true
    env:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${{secret(24)}}
      GF_SERVER_ROOT_URL: ${{NEBULA_PUBLIC_URL}}
      GF_SERVER_DOMAIN: ${{NEBULA_PUBLIC_DOMAIN}}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - name: data
        path: /var/lib/grafana
    resources:
      memoryMb: 512
group: Grafana
notes:
  - "Sign in as admin; the generated password is in the GF_SECURITY_ADMIN_PASSWORD variable. Grafana only applies it on the first start: after that, change the password inside Grafana."
