schema: 1
id: executor
revision: 1
name: Executor
summary: Integration layer that lets AI agents call OpenAPI, MCP and GraphQL tools through one sandboxed MCP endpoint.
description: Executor is a single-container server with an API, MCP endpoint, user accounts, sandboxed code execution and a web console over a SQLite file. This template pre-creates the admin account from the inputs below.
category: ai
tags: [ai, agents, mcp, integrations, automation]
links:
  website: https://executor.sh
  docs: https://executor.sh/docs
  source: https://github.com/UsefulSoftwareCo/executor
upstream:
  license: MIT
  licenseUrl: https://github.com/UsefulSoftwareCo/executor/blob/main/LICENSE
  class: permissive
origin:
  type: coolify
  path: templates/compose/executor.yaml
  commit: 1d28642
  license: Apache-2.0
requires:
  memoryMb: 512
  diskGb: 2
inputs:
  - {key: ADMIN_EMAIL, format: email, label: Admin email, required: true}
  - {key: ADMIN_PASSWORD, label: Admin password, secret: true, default: "${{secret(24)}}"}
services:
  - key: executor
    name: Executor
    kind: app
    image: ghcr.io/usefulsoftwareco/executor-selfhost:1.6.11
    digest: sha256:ea8b4d1019cc00c81cb4236d8edc07a12ac75ef465593b89ae652c0800cd33c1
    port: 4788
    healthcheck:
      type: http
      path: /api/health
      startPeriodSeconds: 20
      deadlineSeconds: 180
    domains:
      - generate: true
    env:
      EXECUTOR_WEB_BASE_URL: ${{NEBULA_PUBLIC_URL}}
      EXECUTOR_BOOTSTRAP_ADMIN_EMAIL: ${input:ADMIN_EMAIL}
      EXECUTOR_BOOTSTRAP_ADMIN_PASSWORD: ${input:ADMIN_PASSWORD}
      EXECUTOR_ALLOW_LOCAL_NETWORK: "false"
    volumes:
      - name: data
        path: /data
    resources:
      memoryMb: 512
group: Executor
notes:
  - "Sign in with the admin email and password from the install form; other people join through single-use invite links from the Admin page."
  - "The MCP endpoint is /mcp on the site's address. If you attach a custom domain, change EXECUTOR_WEB_BASE_URL to match, otherwise browser logins are rejected."
  - "The database and the generated encryption keys live in the data volume: back it up."
