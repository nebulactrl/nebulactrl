schema: 1
id: pretix
revision: 1
name: pretix
summary: Ticket shop and event registration software for conferences, concerts, workshops and festivals.
description: Runs the official pretix standalone image (web, background workers and scheduler in one container) with a managed Postgres database and Redis for cache, sessions and the task queue.
category: web
tags: [ticketing, events, e-commerce, registration]
icon: pretix
links:
  website: https://pretix.eu
  docs: https://docs.pretix.eu/self-hosting/
  source: https://github.com/pretix/pretix
upstream:
  license: AGPL-3.0 with additional terms
  licenseUrl: https://github.com/pretix/pretix/blob/master/LICENSE
  class: copyleft
origin:
  type: dokploy
  path: blueprints/pretix
  commit: e44418a
  license: MIT
requires:
  memoryMb: 1536
  diskGb: 5
  arch: [amd64]
inputs:
  - {key: INSTANCE_NAME, label: Instance name, default: pretix}
  - {key: MAIL_FROM, label: Sender address for emails, default: tickets@example.com}
  - {key: MAIL_HOST, label: SMTP host, description: Without a reachable SMTP server pretix cannot send order confirmations or password resets., default: localhost}
  - {key: MAIL_PORT, format: number, label: SMTP port, default: "25"}
  - {key: MAIL_USER, label: SMTP user}
  - {key: MAIL_PASSWORD, label: SMTP password, secret: true}
  - {key: MAIL_TLS, label: Use STARTTLS, default: "false", options: ["false", "true"]}
services:
  - key: pretix
    name: pretix
    kind: app
    image: pretix/standalone:2026.8.0
    digest: sha256:ec17c2f761f7ad51e6dfc71d5036ea3241f8abf867cc66e015093b24c03c77de
    port: 80
    command: [all]
    healthcheck:
      type: exec
      command: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost/healthcheck/', timeout=8)"]
      intervalSeconds: 30
      timeoutSeconds: 15
      startPeriodSeconds: 90
      deadlineSeconds: 600
    dependsOn: [db, redis]
    domains:
      - generate: true
    env:
      PRETIX_PRETIX_URL: ${{NEBULA_PUBLIC_URL}}
      PRETIX_PRETIX_INSTANCE_NAME: ${input:INSTANCE_NAME}
      PRETIX_PRETIX_DATADIR: /data
      PRETIX_PRETIX_TRUST_X_FORWARDED_FOR: "on"
      PRETIX_PRETIX_TRUST_X_FORWARDED_PROTO: "on"
      PRETIX_DJANGO_SECRET: ${{secret(64)}}
      PRETIX_DATABASE_BACKEND: postgresql
      PRETIX_DATABASE_HOST: ${{db.DATABASE_HOST}}
      PRETIX_DATABASE_PORT: ${{db.DATABASE_PORT}}
      PRETIX_DATABASE_NAME: ${{db.DATABASE_NAME}}
      PRETIX_DATABASE_USER: ${{db.DATABASE_USER}}
      PRETIX_DATABASE_PASSWORD: ${{db.DATABASE_PASSWORD}}
      PRETIX_REDIS_LOCATION: ${{redis.REDIS_URL}}/0
      PRETIX_REDIS_SESSIONS: "true"
      PRETIX_CELERY_BACKEND: ${{redis.REDIS_URL}}/1
      PRETIX_CELERY_BROKER: ${{redis.REDIS_URL}}/2
      PRETIX_MAIL_FROM: ${input:MAIL_FROM}
      PRETIX_MAIL_HOST: ${input:MAIL_HOST}
      PRETIX_MAIL_PORT: ${input:MAIL_PORT}
      PRETIX_MAIL_USER: ${input:MAIL_USER}
      PRETIX_MAIL_PASSWORD: ${input:MAIL_PASSWORD}
      PRETIX_MAIL_TLS: ${input:MAIL_TLS}
    secrets: [PRETIX_REDIS_LOCATION, PRETIX_CELERY_BACKEND, PRETIX_CELERY_BROKER]
    volumes:
      - {name: data, path: /data}
      - {name: config, path: /etc/pretix}
    resources:
      memoryMb: 1536
  - key: db
    name: pretix DB
    kind: database
    database:
      engine: postgres
      version: "16"
      databaseName: pretix
  - key: redis
    name: pretix Redis
    kind: database
    database:
      engine: redis
      version: "8"
group: pretix
notes:
  - "Sign in at /control/ with the default account admin@localhost and password admin, and change both immediately: until you do, anyone can log in as administrator."
  - "Create an organizer first, then an event. The site URL is fixed to the generated domain through PRETIX_PRETIX_URL: if you attach a custom domain, update it and redeploy."
  - "pretix is AGPL-3.0 with additional terms: they forbid offering it as a hosted service for third parties and require the attribution footer to stay. Read the licence before using it commercially."
