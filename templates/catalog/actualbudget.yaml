schema: 1
id: actualbudget
revision: 1
name: Actual Budget
summary: Local-first personal finance and envelope budgeting app with optional multi-device sync.
description: Actual Budget is a fast, privacy-focused budgeting tool for tracking accounts, transactions and envelopes. The sync server stores budget files on a volume so several devices can share them.
category: productivity
tags: [budgeting, finance, money, personal-finance]
icon: actualbudget
links:
  website: https://actualbudget.org
  docs: https://actualbudget.org/docs/install/docker
  source: https://github.com/actualbudget/actual
upstream:
  license: MIT
  licenseUrl: https://github.com/actualbudget/actual/blob/master/LICENSE.txt
  class: permissive
origin:
  type: coolify
  path: templates/compose/actualbudget.yaml
  commit: 5d66fb7
  license: Apache-2.0
requires:
  memoryMb: 256
  diskGb: 1
services:
  - key: actual-server
    name: Actual Budget
    kind: app
    image: actualbudget/actual-server:26.10.0
    digest: sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c
    port: 5006
    healthcheck:
      type: tcp
      startPeriodSeconds: 10
      deadlineSeconds: 120
    env:
      ACTUAL_LOGIN_METHOD: password
    volumes:
      - name: data
        path: /data
    domains:
      - generate: true
    resources:
      memoryMb: 256
group: Actual Budget
notes:
  - "On first visit you choose the server password; it protects every budget file on this server."
  - "Actual needs HTTPS (or localhost) to work in the browser, so use the generated domain with TLS."
