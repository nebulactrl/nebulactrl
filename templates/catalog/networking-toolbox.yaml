    name: Networking Toolbox
    kind: app
    image: lissy93/networking-toolbox:1.6.0
    digest: sha256:4e97330fb310e1a5fbe185b1bf859270902ddef7934b88cecc6b3def98d21eaa
    port: 3000
    healthcheck:
      type: http
