summary: Read-it-later app that saves the readable content of web pages, with highlights, labels and full-text search.
description: Readeck keeps articles, videos and pictures you save from the web in your own collection, with a browser extension and mobile-friendly reader. This template runs the official image with its database and bookmark files in a persistent volume.
