schema: 1
id: browserless
revision: 1
name: Browserless
summary: Headless Chromium as a service, driven over Puppeteer, Playwright or a REST API.
description: Browserless runs Chromium in a container and exposes it over WebSocket and HTTP, so scrapers, test suites and PDF or screenshot jobs can use a remote browser. Requests must carry the access token.
category: devtools
tags: [chrome, headless, browser, puppeteer, playwright, automation]
icon: googlechrome
links:
  website: https://www.browserless.io
  docs: https://docs.browserless.io
  source: https://github.com/browserless/browserless
upstream:
  license: SSPL-1.0 OR Browserless Commercial License
  licenseUrl: https://github.com/browserless/browserless/blob/main/LICENSE
  class: source-available
origin:
  type: coolify
  path: templates/compose/browserless.yaml
  commit: 5d66fb7
  license: Apache-2.0
requires:
  memoryMb: 1024
  diskGb: 4
inputs:
  - {key: TOKEN, label: Access token, secret: true, default: "${{secret(32)}}"}
services:
  - key: browserless
    name: Browserless
    kind: app
    image: ghcr.io/browserless/chromium:v2.57.3
    digest: sha256:40dff7c23e0e378ba451c23ef66394ffb81bd11e6b9fe8ef3066d59eb402cc5d
    port: 3000
    healthcheck:
      type: http
      path: /docs
      startPeriodSeconds: 10
      deadlineSeconds: 120
    domains:
      - generate: true
    env:
      TOKEN: ${input:TOKEN}
    resources:
      memoryMb: 1024
group: Browserless
notes:
  - "Every request needs the access token from the install form: append ?token=<token> to the WebSocket or REST URL."
  - "The licence is SSPL-1.0 or a commercial licence; closed-source commercial use needs the commercial licence from Browserless."
