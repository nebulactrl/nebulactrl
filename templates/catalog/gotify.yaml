schema: 1
id: gotify
revision: 1
name: Gotify
summary: Simple self-hosted push notification server with a web UI, REST API and Android app, backed by a managed PostgreSQL database.
description: Gotify delivers push notifications from your scripts and services to the web UI and the Android app over a REST API and WebSocket stream. This template runs the official image with a managed PostgreSQL database and a generated admin password.
category: automation
tags: [notifications, push, messaging, self-hosted]
icon: gotify
links:
  website: https://gotify.net
  docs: https://gotify.net/docs/
  source: https://github.com/gotify/server
upstream:
  license: MIT
  licenseUrl: https://github.com/gotify/server/blob/master/LICENSE
  class: permissive
origin:
  type: coolify
  path: templates/compose/gotify.yaml
  commit: 5d66fb7
  license: Apache-2.0
requires:
  memoryMb: 256
  diskGb: 1
inputs:
  - {key: ADMIN_USER, label: Admin username, required: true, default: admin}
  - {key: ADMIN_PASSWORD, label: Admin password, secret: true, default: "${{secret(20)}}"}
services:
  - key: gotify
    name: Gotify
    kind: app
    image: gotify/server:3.1.1
    digest: sha256:44fc5bbd1c0618878e33073d38c2c13126b48f245c3fe12236b1da48eb203b86
    port: 80
    healthcheck:
      type: http
      path: /health
      startPeriodSeconds: 10
      deadlineSeconds: 120
    dependsOn: [db]
    domains:
      - generate: true
    env:
      GOTIFY_SERVER_PORT: "80"
      GOTIFY_DATABASE_DIALECT: postgres
      GOTIFY_DATABASE_CONNECTION: host=${{db.DATABASE_HOST}} port=${{db.DATABASE_PORT}} user=${{db.DATABASE_USER}} dbname=${{db.DATABASE_NAME}} password=${{db.DATABASE_PASSWORD}} sslmode=disable
      GOTIFY_DEFAULTUSER_NAME: ${input:ADMIN_USER}
      GOTIFY_DEFAULTUSER_PASS: ${input:ADMIN_PASSWORD}
      GOTIFY_REGISTRATION: "false"
    secrets: [GOTIFY_DATABASE_CONNECTION]
    volumes:
      - name: data
        path: /app/data
    resources:
      memoryMb: 128
  - key: db
    name: Gotify DB
    kind: database
    database:
      engine: postgres
      version: "17"
      databaseName: gotify
group: Gotify
notes:
  - "Sign in with the admin username and password from the install form; the admin account is only created on the first start, so change passwords afterwards in the web UI."
  - "Uploaded app icons and plugins live in the data volume; messages and users are stored in the managed database. Public registration is switched off."
