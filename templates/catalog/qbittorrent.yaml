schema: 1
id: qbittorrent
revision: 1
name: qBittorrent
summary: BitTorrent client with a web interface, running headless as qbittorrent-nox.
description: qBittorrent is a free BitTorrent client; this template runs the official qbittorrent-nox image with its web UI, a config volume and a downloads volume, and publishes the torrenting port for incoming peers. You must confirm qBittorrent's legal notice to start it.
category: media
tags: [torrent, bittorrent, downloads, web-ui]
icon: qbittorrent
links:
  website: https://www.qbittorrent.org
  docs: https://github.com/qbittorrent/docker-qbittorrent-nox#readme
  source: https://github.com/qbittorrent/qBittorrent
upstream:
  license: GPL-2.0-or-later
  licenseUrl: https://github.com/qbittorrent/qBittorrent/blob/master/COPYING
  class: copyleft
origin:
  type: coolify
  path: templates/compose/qbittorrent.yaml
  commit: 1d28642
  license: Apache-2.0
requires:
  memoryMb: 512
  diskGb: 20
inputs:
  - key: QBT_LEGAL_NOTICE
    label: Confirm qBittorrent's legal notice
    description: "qBittorrent is a file sharing program: when you run a torrent its data is made available to others by upload, and you are solely responsible for the content you share. Choose confirm to accept this legal notice (see the qBittorrent project's docker-qbittorrent-nox readme); qBittorrent does not start otherwise."
    required: true
    options: [confirm, no]
  - {key: TIMEZONE, label: "Timezone (IANA name, for example Europe/Berlin)", default: UTC}
services:
  - key: qbittorrent
    name: qBittorrent
    kind: app
    image: qbittorrentofficial/qbittorrent-nox:5.3.0-1
    digest: sha256:58ca75cb969c5185b7ad72fe877d9de1dc6891d0aef9d2ee20d0556b1d6ec3f9
    port: 8080
    healthcheck:
      type: http
      path: /
      startPeriodSeconds: 20
      deadlineSeconds: 180
    domains:
      - generate: true
    env:
      QBT_LEGAL_NOTICE: ${input:QBT_LEGAL_NOTICE}
      QBT_WEBUI_PORT: "8080"
      QBT_TORRENTING_PORT: "6881"
      TZ: ${input:TIMEZONE}
    ports:
      - {name: torrent-tcp, port: 6881, protocol: tcp, publish: true}
      - {name: torrent-udp, port: 6881, protocol: udp, publish: true}
    volumes:
      - name: config
        path: /config
      - name: downloads
        path: /downloads
    resources:
      memoryMb: 512
    stopGraceSeconds: 1800
group: qBittorrent
notes:
  - "On the first start qBittorrent generates a temporary password for the user admin and prints it to the service logs: sign in with it, then set your own under Tools > Options > WebUI."
  - "Peers connect to port 6881 (TCP and UDP) of the server; the downloads are stored on the downloads volume."
