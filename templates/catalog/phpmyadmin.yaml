schema: 1
id: phpmyadmin
revision: 1
name: phpMyAdmin
summary: Web interface for administering MySQL and MariaDB servers, with a login page that accepts any server host.
description: phpMyAdmin manages databases, tables, users and imports for MySQL and MariaDB. This template runs the Docker Official image with arbitrary-server login enabled, so you sign in with the host and credentials of the server you want to manage.
category: data
tags: [database, mysql, mariadb, admin, sql]
icon: phpmyadmin
links:
  website: https://www.phpmyadmin.net/
  docs: https://docs.phpmyadmin.net/
  source: https://github.com/phpmyadmin/phpmyadmin
upstream:
  license: GPL-2.0-only
  licenseUrl: https://github.com/phpmyadmin/phpmyadmin/blob/master/LICENSE
  class: copyleft
origin:
  type: coolify
  path: templates/compose/phpmyadmin.yaml
  commit: 1d28642
  license: Apache-2.0
requires:
  memoryMb: 256
  diskGb: 1
services:
  - key: phpmyadmin
    name: phpMyAdmin
    kind: app
    image: phpmyadmin:5.2.3-apache
    digest: sha256:4de49392e023fa330f49ecc72a79384359783856ade762272112ed347ab32706
    port: 80
    healthcheck:
      type: http
      path: /
      startPeriodSeconds: 10
      deadlineSeconds: 120
    env:
      PMA_ARBITRARY: "1"
      PMA_ABSOLUTE_URI: ${{NEBULA_PUBLIC_URL}}/
    domains:
      - generate: true
    resources:
      memoryMb: 256
group: phpMyAdmin
notes:
  - "There is no phpMyAdmin account: enter the host name, user and password of the MySQL or MariaDB server on the login page (managed databases are reachable by their private host name)."
  - "Anyone who can open this address can try database logins. Restrict access (for example with an IP allow-list or SSO in front of it) before exposing it on the internet."
