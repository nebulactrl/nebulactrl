schema: 1
id: pastefy
revision: 1
name: Pastefy
summary: Pastebin with syntax highlighting, folders and optional OAuth2 login.
description: Pastefy is a self-hosted pastebin for sharing text and code snippets. This template runs the app with a managed MariaDB database; anonymous pasting works without any login provider.
category: devtools
tags: [pastebin, snippets, text-sharing, syntax-highlighting, oauth2]
links:
  website: https://pastefy.app
  docs: https://docs.pastefy.app
  source: https://github.com/interaapps/pastefy
upstream:
  license: MIT
  licenseUrl: https://github.com/interaapps/pastefy/blob/master/LICENSE
  class: permissive
origin:
  type: dokploy
  path: blueprints/pastefy
  commit: e44418a
  license: MIT
requires:
  memoryMb: 768
  diskGb: 2
  arch: [amd64]
services:
  - key: app
    name: Pastefy
    kind: app
    image: interaapps/pastefy:7.2.6
    digest: sha256:d2abe24232aa54023c472b033fe50cc8db0df8769bbe8099575d2bdaeed3ecb0
    port: 80
    healthcheck:
      type: http
      path: /
      startPeriodSeconds: 20
      deadlineSeconds: 180
    dependsOn: [db]
    domains:
      - generate: true
    env:
      HTTP_SERVER_PORT: "80"
      HTTP_SERVER_CORS: "*"
      SERVER_NAME: ${{NEBULA_PUBLIC_URL}}
      DATABASE_DRIVER: mysql
      DATABASE_HOST: ${{db.DATABASE_HOST}}
      DATABASE_PORT: ${{db.DATABASE_PORT}}
      DATABASE_NAME: ${{db.DATABASE_NAME}}
      DATABASE_USER: ${{db.DATABASE_USER}}
      DATABASE_PASSWORD: ${{db.DATABASE_PASSWORD}}
    resources:
      memoryMb: 768
  - key: db
    name: Pastefy DB
    kind: database
    database:
      engine: mariadb
      version: "11.8"
      databaseName: pastefy
group: Pastefy
notes:
  - "Open the domain and paste right away: no login is required. To enable sign-in, add the OAUTH2_<PROVIDER>_CLIENT_ID and OAUTH2_<PROVIDER>_CLIENT_SECRET variables of a provider (Google, GitHub, Discord, Twitch or InteraApps) to the Pastefy service."
