schema: 1
id: onetimesecret
revision: 1
name: Onetime Secret
summary: Share passwords and other sensitive text through self-destructing links that can be opened only once.
description: Onetime Secret stores a message encrypted behind a one-time link and deletes it after it has been viewed or has expired. This template runs the app with a managed Valkey database that holds all secrets and accounts.
category: security
tags: [secrets, passwords, sharing, privacy, security]
icon: onetimesecret
links:
  website: https://onetimesecret.com
  docs: https://docs.onetimesecret.com
  source: https://github.com/onetimesecret/onetimesecret
upstream:
  license: MIT
  licenseUrl: https://github.com/onetimesecret/onetimesecret/blob/main/LICENSE.txt
  class: permissive
origin:
  type: coolify
  path: templates/compose/onetimesecret.yaml
  commit: 5d66fb7
  license: Apache-2.0
requires:
  memoryMb: 512
  diskGb: 2
services:
  - key: app
    name: Onetime Secret
    kind: app
    image: onetimesecret/onetimesecret:v0.26.19
    digest: sha256:eb630051046042195a1dee73367f4f02a33ab3275bdc4d77a5d2c3dba88d3f0e
    port: 3000
    healthcheck:
      type: http
      path: /health
      startPeriodSeconds: 30
      deadlineSeconds: 180
    dependsOn: [db]
    domains:
      - generate: true
    env:
      RACK_ENV: production
      HOST: ${{NEBULA_PUBLIC_DOMAIN}}
      SSL: "true"
      SECRET: ${{randomBytes(32,"hex")}}
      VALKEY_URL: ${{db.VALKEY_URL}}
    resources:
      memoryMb: 512
  - key: db
    name: Onetime Secret DB
    kind: database
    database:
      engine: valkey
      version: "9"
group: Onetime Secret
notes:
  - "Creating and viewing secrets works right away without an account. The generated SECRET variable encrypts everything: back it up, losing it makes stored secrets unreadable."
  - "Serve the app over HTTPS (SSL is on, session cookies are Secure). To create the first admin (colonel) account run `bin/ots customers create you@example.com --role colonel` inside the container; it prints a generated password."
