schema: 1
id: linkwarden
revision: 1
name: Linkwarden
summary: Collaborative bookmark manager that saves, organizes and archives web pages as screenshots, PDFs and readable copies.
description: Linkwarden collects links into shared collections and preserves each page so it stays readable if the original disappears. This template runs the app with a managed Postgres database and a Meilisearch instance for full-text search.
category: productivity
tags: [bookmarks, archive, collaboration, read-later]
icon: linkwarden
links:
  website: https://linkwarden.app
  docs: https://docs.linkwarden.app/self-hosting/installation
  source: https://github.com/linkwarden/linkwarden
upstream:
  license: AGPL-3.0
  licenseUrl: https://github.com/linkwarden/linkwarden/blob/main/LICENSE.md
  class: copyleft
origin:
  type: coolify
  path: templates/compose/linkwarden.yaml
  commit: 5d66fb7
  license: Apache-2.0
requires:
  memoryMb: 2048
  diskGb: 5
services:
  - key: linkwarden
    name: Linkwarden
    kind: app
    image: ghcr.io/linkwarden/linkwarden:v2.16.3
    digest: sha256:0664c28a039bda8ffa6663389e8536b2fc717219e329f85b83faca7efed3b144
    port: 3000
    healthcheck:
      type: http
      path: /
      intervalSeconds: 10
      timeoutSeconds: 20
      startPeriodSeconds: 30
      deadlineSeconds: 300
    dependsOn: [db, meilisearch]
    domains:
      - generate: true
    env:
      DATABASE_URL: ${{db.DATABASE_URL}}
      NEXTAUTH_SECRET: ${{secret(48)}}
      NEXTAUTH_URL: ${{NEBULA_PUBLIC_URL}}/api/v1/auth
      MEILI_HOST: http://${{meilisearch.NEBULA_PRIVATE_HOST}}:7700
      MEILI_MASTER_KEY: ${{meilisearch.MEILI_MASTER_KEY}}
    volumes:
      - name: data
        path: /data/data
    resources:
      memoryMb: 2048
  - key: db
    name: Linkwarden DB
    kind: database
    database:
      engine: postgres
      version: "17"
      databaseName: linkwarden
  - key: meilisearch
    name: Linkwarden Meilisearch
    kind: worker
    image: getmeili/meilisearch:v1.56.0
    digest: sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
    healthcheck:
      type: http
      path: /health
      port: 7700
      startPeriodSeconds: 10
      deadlineSeconds: 120
    env:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${{secret(32)}}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - name: meili-data
        path: /meili_data
    resources:
      memoryMb: 512
group: Linkwarden
notes:
  - "Open the app and register the first account; it becomes the administrator. Registration stays open to everyone who can reach the domain: after creating your account, set NEXT_PUBLIC_DISABLE_REGISTRATION=true on the Linkwarden service and redeploy."
  - "The auth URL is taken from the generated domain. If you attach a custom domain, update NEXTAUTH_URL to match and redeploy."
