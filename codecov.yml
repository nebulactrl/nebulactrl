# Codecov (https://app.codecov.io/gh/nebulactrl/nebulactrl). ci.yml uploads,
# through OIDC (no token), the coverage of the three Go test shards (flag `go`),
# of the Docker smoke scenarios (flag `smoke`) and of the web unit tests (flag
# `web`). Go coverage is cross-package (-coverpkg=./...): a test counts for
# every package it runs. See docs/research/coverage-practices.md.
#
# New code must be at least 85% covered (codecov/patch is a required check). The
# project's target is 85% too; it is shown on every pull request and becomes a
# required check once the total reaches it. Generated code, developer tools and
# test scaffolding are left out so the numbers describe the product's own code.
codecov:
  notify:
    # Report once every upload of a commit is in: three Go shards, smoke, the web
    # packages and the three web-test shards.
    # Keep this equal to the number of upload steps in ci.yml.
    after_n_builds: 8

coverage:
  status:
    project:
      default:
        target: 85%
        informational: true # required once the total reaches 85%
    patch:
      default:
        target: 85%
comment:
  layout: "condensed_header, diff, flags, condensed_files"
  require_changes: true # no comment on pull requests that do not change coverage

flag_management:
  default_rules:
    # A run that skips a flag keeps its last numbers.
    carryforward: true

# Go reports module paths; map them onto the repository.
fixes:
  - "github.com/nebulactrl/nebulactrl/::"

ignore:
  # Generated code.
  - "internal/db/*.sql.go"
  - "internal/db/db.go"
  - "internal/db/models.go"
  - "internal/apiclient/**"
  - "pkg/agentprotocol/dns_lego_catalog.go"
  - "apps/web/src/api/gen/**"
  - "apps/web/src/routeTree.gen.ts"
  # Developer tools (not shipped) and test scaffolding: the integration harness,
  # fixtures, installer tests and the test-support packages (the same set
  # scripts/ci/deadcode.sh treats as support code). Folders are listed by name,
  # the form Codecov documents for "a folder and all its contents".
  - "tools"
  - "tests"
  - "internal/testutil"
  - "internal/templates/testsample"
  - "internal/stacktest"
  - "internal/agent/compose/composetest"
  - "internal/auth/passkeytest"
  - "internal/auth/totptest"
  - "internal/gitssh/gitsshtest"
  - "internal/mesh/meshtest"
  - "internal/notifications/notificationstest"
  - "internal/prodguard/prodguardtest"
  - "internal/releasesign/releasesigntest"
  - "internal/systemroute/systemroutetest"
  # Dev-only web pages. The dither catalogue is a knob gallery behind
  # import.meta.env.DEV (routes/dev.dither.tsx 404s in a production build and
  # the lazy import is dropped, so these folders never reach the bundle). They
  # are reachable from no other route; the components they show are
  # packages/dither, which has its own tests. The route file itself ships and
  # stays counted (routes/redirects.test.tsx covers its guard).
  - "apps/web/src/features/dev"
  - "apps/web/src/components/dither"
